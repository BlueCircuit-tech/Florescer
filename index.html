<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Florescer — Fertilidade & Maternidade</title>
<meta name="description" content="Florescer: acompanhamento de ciclo menstrual, período fértil, diário da tentante, gestação e pós-parto. Seus dados ficam no seu aparelho.">
<meta name="application-name" content="Florescer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF7F8">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:type" content="website">

<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="shell">

  <div class="device">
    <div class="device__frame">
      <div class="app" id="app">

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
